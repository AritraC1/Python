[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ml"
version = "0.1.0"
description = "ML implementations from scratch — Andrew Ng ML Specialisation"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "scipy>=1.10",        
    "jupyter>=1.0",
    "ipykernel>=6.0",     
    "ipympl>=0.9",         
    "ipywidgets>=8.0",    
    "pillow>=10.0",       
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "pylint>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_systems*", "common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.pylance]  
pythonPath = "."